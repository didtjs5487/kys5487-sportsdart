<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>스포츠다트 리그</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다트리그">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3F2; --panel:#FFFFFF; --soft:#E3ECEA; --line:#C9D6D3;
    --ink:#14211F; --sub:#4A5D59; --pri:#0F766E; --pri2:#0B5E58; --priSoft:#D5EEEA;
    --cu:#C2410C; --cuSoft:#FDE6D8; --x3:#1D4ED8; --x3Soft:#DCE6FD;
    --good:#15803D; --bad:#B91C1C; --warn:#A16207; --warnSoft:#FEF3C7;
    --r1:#B8860B; --r1Soft:#FFF1C2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",system-ui,sans-serif; font-size:18px; line-height:1.5;
    -webkit-text-size-adjust:100%; padding-bottom:40px}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1100px; margin:0 auto; padding:0 16px}

  header{background:var(--pri); color:#fff; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header .wrap{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:10px; padding-bottom:10px}
  header h1{margin:0; font-size:24px; font-weight:800; white-space:nowrap}
  header select{background:#fff; color:var(--ink); border:0; border-radius:12px; font-size:20px; font-weight:800; padding:8px 12px; min-height:50px}
  #status{margin-left:auto; font-size:15px; background:rgba(255,255,255,.16); border-radius:999px; padding:6px 14px; white-space:nowrap}

  nav{display:flex; gap:6px; overflow-x:auto; padding:12px 0 0}
  nav button{flex:1 0 auto; min-height:54px; border:0; border-radius:14px 14px 0 0; background:var(--soft); color:var(--sub);
    font-size:18px; font-weight:800; padding:0 18px}
  nav button.on{background:var(--panel); color:var(--pri)}
  main{background:var(--panel); border-radius:0 0 16px 16px; padding:18px 16px 24px; min-height:60vh}

  h2{font-size:23px; margin:4px 0 12px}
  h3{font-size:20px; margin:18px 0 10px}
  .hint{color:var(--sub); font-size:16px; margin:6px 0 12px}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .sp{flex:1}
  .btn{min-height:52px; border:0; border-radius:14px; padding:0 18px; font-size:18px; font-weight:800; background:var(--soft); color:var(--ink)}
  .btn.pri{background:var(--pri); color:#fff}
  .btn.ghost{background:transparent; border:2px solid var(--line)}
  .btn.danger{background:#FDE2E2; color:var(--bad)}
  .btn.big{min-height:60px; font-size:20px; padding:0 26px}
  .btn:disabled{opacity:.4; cursor:default}
  input[type=text],input[type=number],select,textarea{border:2px solid var(--line); border-radius:12px; background:#fff; padding:10px 12px; font-size:18px; min-height:52px}
  textarea{width:100%; min-height:150px; font-size:16px; line-height:1.45}
  .card{border:2px solid var(--line); border-radius:16px; padding:14px; background:#fff}
  .note{background:var(--warnSoft); border-radius:12px; padding:12px 14px; font-size:16px; margin:10px 0}
  .ok{color:var(--good)} .bad{color:var(--bad)}

  /* 스테이지·라운드 고르기 */
  .seg{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .seg button{min-height:54px; border:2px solid var(--line); background:#fff; border-radius:14px; padding:0 20px; font-size:19px; font-weight:800; color:var(--sub)}
  .seg button.on.cu{background:var(--cu); border-color:var(--cu); color:#fff}
  .seg button.on.x3{background:var(--x3); border-color:var(--x3); color:#fff}
  .seg button.on.plain{background:var(--pri); border-color:var(--pri); color:#fff}
  .seg button .done{font-size:15px; font-weight:600; margin-left:6px; opacity:.85}

  /* 명렬 */
  .stuGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
  .stu{display:flex; align-items:center; gap:8px; border:2px solid var(--line); border-radius:14px; background:#fff; min-height:60px; padding:6px 6px 6px 12px}
  .stu .nm{flex:1; text-align:left; border:0; background:transparent; font-size:19px; font-weight:800; min-height:50px; padding:0}
  .stu .nm small{display:block; font-size:14px; font-weight:600; color:var(--sub)}
  .stu.abs{background:#F3F4F6; border-style:dashed}
  .stu.abs .nm{color:#9CA3AF; text-decoration:line-through}
  .star{width:50px; height:50px; border-radius:12px; border:0; background:var(--soft); font-size:22px; color:#9CA3AF}
  .star.on{background:var(--r1Soft); color:var(--r1)}

  /* 조 */
  .grpGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
  .grp{border:2px solid var(--line); border-radius:16px; padding:12px; background:#fff}
  .grp.cu{border-color:#F3C3A4} .grp.x3{border-color:#AFC4F7}
  .grp h4{margin:0 0 8px; font-size:21px; display:flex; align-items:center; gap:8px}
  .tag{font-size:15px; font-weight:800; border-radius:8px; padding:2px 8px; background:var(--soft); color:var(--sub)}
  .chips{display:flex; flex-direction:column; gap:6px}
  .chip{display:flex; align-items:center; gap:8px; min-height:52px; border:2px solid var(--line); border-radius:12px; background:#fff;
    padding:0 12px; font-size:19px; font-weight:800; text-align:left; width:100%}
  .sx{display:inline-block; font-size:14px; font-weight:800; color:#BE185D; background:#FCE7F3; border-radius:6px; padding:0 6px; margin-left:4px; vertical-align:2px}
.boards{display:grid; grid-template-columns:repeat(10,1fr); gap:6px}
  .bd{min-height:58px; border:2px solid var(--line); border-radius:12px; background:#fff; font-size:22px; font-weight:800; color:#9CA3AF; line-height:1.1; padding:2px}
  .bd small{display:block; font-size:13px; font-weight:600}
  .bd.on{background:var(--pri); border-color:var(--pri); color:#fff}
  .bd.clash{background:var(--bad); border-color:var(--bad)}
  .bd.dead{background:#F3F4F6; color:#C4C9CF; border-style:dashed; text-decoration:line-through}
  .bd.pw.on{background:var(--good); border-color:var(--good); color:#fff}
  .bd.pw.off{background:#F3F4F6; color:#9CA3AF; border-style:dashed}
  @media (max-width:560px){ .boards{grid-template-columns:repeat(5,1fr)!important} }
.go{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
  .go .btn{min-height:68px; font-size:22px}
  .btn.alt{background:var(--cu)}
  details.setup{margin-bottom:14px}
  details.setup summary{cursor:pointer; min-height:52px; display:flex; align-items:center; font-size:18px; font-weight:800; color:var(--sub); border:2px dashed var(--line); border-radius:14px; padding:0 14px; margin-bottom:10px; list-style:none}
  details.setup[open] summary{color:var(--pri)}
  .banner{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#DCFCE7; border:2px solid var(--good); border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:19px; font-weight:800; color:var(--good)}
  .banner .btn{margin-left:auto}
  .ecard.focus{box-shadow:0 0 0 4px var(--cu); border-color:var(--cu)}
.selBar{position:sticky; top:76px; z-index:10; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--priSoft); border:2px solid var(--pri); border-radius:14px; padding:10px 12px; margin-bottom:12px; font-size:17px}
  .selBar b:first-child{font-size:19px}
.absGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
  .absBtn{min-height:52px; border:2px solid var(--line); border-radius:12px; background:#fff; font-size:17px; font-weight:800; text-align:left; padding:4px 10px}
  .absBtn small{display:block; font-size:14px; color:var(--bad)}
  .absBtn.out{background:#FDE2E2; border-color:var(--bad); color:var(--bad); text-decoration:line-through}
  .chip .no{color:var(--sub); font-weight:600; min-width:28px}
  .chip .info{margin-left:auto; font-size:15px; font-weight:600; color:var(--sub)}
  .chip.sel{border-color:var(--pri); background:var(--priSoft); box-shadow:0 0 0 3px var(--priSoft)}
  .chip.abs{color:#9CA3AF; border-style:dashed}
  .moveHere{margin-top:8px; width:100%}

  /* 경기 입력 */
  .entryGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
  .ecard{border:2px solid var(--line); border-radius:16px; padding:12px; background:#fff}
  .ecard.done{border-color:var(--good); box-shadow:0 0 0 2px #CDEBD6 inset}
  .ecard h4{margin:0 0 6px; font-size:21px; display:flex; align-items:center; gap:8px}
  .ecard h4 .st{margin-left:auto; font-size:15px; font-weight:800}
  .prow{display:grid; grid-template-columns:1fr 104px; grid-template-rows:auto auto; gap:6px 8px; padding:8px 0; border-top:1px solid var(--soft)}
  .prow:first-of-type{border-top:0}
  .prow .who{font-size:19px; font-weight:800; align-self:center}
  .prow .who small{font-weight:600; color:var(--sub); font-size:15px; margin-right:4px}
  .prow input{width:104px; text-align:center; font-size:22px; font-weight:800; padding:6px}
  .ranks{grid-column:1 / -1; display:flex; gap:6px; align-items:center}
  .ranks button{flex:1; min-height:50px; border:2px solid var(--line); border-radius:12px; background:#fff; font-size:18px; font-weight:800; color:var(--sub)}
  .ranks button.on{background:var(--pri); border-color:var(--pri); color:#fff}
  .ranks button.on.r1{background:var(--r1); border-color:var(--r1)}
  .ranks .pts{min-width:62px; text-align:right; font-size:16px; font-weight:800; color:var(--pri)}
  .prow.abs .who{color:#9CA3AF}
  .prow.abs .ranks{display:none}
  .ecard .foot{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .ecard .foot .btn{min-height:50px; font-size:16px; padding:0 14px}
  .pickList{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
  .pickList button{min-height:50px; border:2px dashed var(--warn); background:var(--warnSoft); border-radius:12px; padding:0 14px; font-size:17px; font-weight:800}

  /* 순위·성적 */
  .tblWrap{overflow-x:auto; border:2px solid var(--line); border-radius:14px}
  table{border-collapse:collapse; width:100%; font-size:17px; white-space:nowrap}
  th,td{border-bottom:1px solid var(--soft); padding:8px 8px; text-align:center}
  th{background:var(--soft); font-size:16px; position:sticky; top:0}
  th.cu{background:var(--cuSoft)} th.x3{background:var(--x3Soft)}
  td.nm{text-align:left; font-weight:800}
  td.miss{background:var(--warnSoft); color:var(--warn); font-weight:800}
  td.sum{font-weight:800}
  td.grade{font-weight:800; font-size:20px; color:var(--pri)}
  .tk{min-width:50px; min-height:46px; border:2px solid var(--line); border-radius:10px; background:#fff; font-size:15px; font-weight:800; color:#9CA3AF; margin:0 2px}
  .tk.on{background:var(--good); border-color:var(--good); color:#fff}

  /* 크게 보기 */
  #big{position:fixed; inset:0; background:#0B1A18; color:#fff; z-index:50; overflow:auto; padding:20px 16px; display:none}
  #big.show{display:block}
  #big h2{font-size:34px; margin:0 0 16px; display:flex; align-items:center; gap:12px}
  #big .bgGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
  #big .bg{background:#15302C; border-radius:16px; padding:14px 16px}
  #big .bg b{display:block; font-size:28px; color:#5EEAD4; margin-bottom:6px}
  #big .bg div{font-size:28px; font-weight:800; line-height:1.45}
  #big .close{margin-left:auto; background:#fff; color:#000}
  #big .bigTop{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  #big .bigTop h2{margin:0; font-size:32px}
  #big .bigTop button{min-height:50px; border-radius:12px; border:2px solid #2C5C55; background:transparent; color:#CFE9E4; font-size:18px; font-weight:800; padding:0 14px}
  #big .bigTop button.on{background:#5EEAD4; border-color:#5EEAD4; color:#062A25}
  #big .arena{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; min-height:calc(100vh - 120px); grid-auto-rows:1fr}
  #big .bd2{background:#15302C; border-radius:18px; padding:12px 14px; display:flex; flex-direction:column; min-width:0; border:3px solid transparent}
  #big .bd2.empty{opacity:.35}
  #big .bd2[data-act]{cursor:pointer}
  #big .bd2[data-act]:hover{border-color:#5EEAD4}
  #big .bd2.clash{border-color:#F87171}
  #big .bd2 .hd{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  #big .bd2 .n{width:58px; height:58px; border-radius:50%; background:#5EEAD4; color:#062A25; font-size:32px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
  #big .bd2 .c{font-size:20px; font-weight:800; color:#FCD34D; line-height:1.2}
  #big .bd2 .nm{font-size:clamp(22px,2.3vw,36px); font-weight:800; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #big .bd2 .nm .sx{font-size:16px; vertical-align:4px}
  #big .bd2 .nx{margin-top:auto; padding-top:8px; border-top:2px dashed #2C5C55; font-size:18px; font-weight:700; color:#FCD34D; line-height:1.4}
  @media (max-width:900px){ #big .arena{grid-template-columns:repeat(2,1fr); min-height:0} }

  #toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#14211F; color:#fff; padding:14px 22px; border-radius:14px;
    font-size:18px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center}
  #toast.show{opacity:1}
  .qr{background:#fff; padding:10px; display:inline-block; border-radius:12px; border:2px solid var(--line)}
  code{background:var(--soft); padding:2px 6px; border-radius:6px; font-size:15px}
  pre{background:var(--soft); padding:12px; border-radius:12px; font-size:15px; overflow-x:auto}
  .rules td,.rules th{white-space:normal}
  @media (max-width:560px){
    header h1{font-size:20px}
    #status{margin-left:0}
    .entryGrid{grid-template-columns:1fr}
  }
  @media print{
    header,nav,.noprint{display:none!important}
    main{padding:0}
    body{background:#fff}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🎯 스포츠다트 리그</h1>
    <select id="clsSel" aria-label="반 선택"></select>
    <span id="status">⚪ 연결 중…</span>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="big"></div>
<div id="toast"></div>

<script type="module">
/* =========================================================
   스포츠다트 리그 — 1학년 체육2 (2026-2학기)
   다트 기계 태블릿은 게스트 경기라 결과가 남지 않는다.
   경기가 끝나면 태블릿 화면의 점수·순위를 여기에 옮겨 적고,
   조 편성·승점·평가 점수까지 한 번에 관리한다.

   기준: 2026학년도 2학기 교수학습 및 평가운영 계획(1학년 체육2) — 3) 스포츠다트
   ========================================================= */
const CFG = {
  size: 4,                 // 최대 4명씩 조 편성
  rounds: 3,               // 3라운드 실시하여 승점 합산
  boards: 10,              // 다트기 기본 대수 — 설정은 S.settings.count / 고장·미설치는 S.settings.off
  maxGroup: 5,             // 다트가 모자랄 때만 5명 조까지
  // 조별 순위 승점 — 1등 4점·꼴찌 1점은 몇 명 조든 같게, 가운데는 고르게 나눠 반올림.
  // 3명 4·3·1 / 4명 4·3·2·1(평가계획서) / 5명 4·3·3·2·1. 결석으로 인원이 줄어도 실제 던진 인원 기준.
  // 합산 승점 → 영역 점수 (Ⓐ·Ⓑ 같음)
  conv: [[10, 10], [8, 8], [6, 6], [4, 4], [0, 2]],
  // Ⓐ+Ⓑ+Ⓒ → 최종 점수 (기본 점수 8점)
  total: [[16, 20], [14, 18], [12, 16], [10, 14], [8, 12], [5, 10], [0, 8]],
};
const STAGES = {
  cu: { name: "카운트 업", mark: "Ⓐ", better: "high", vLabel: "점수", hint: "태블릿에 나온 최종 점수를 적으면 순위가 자동으로 매겨집니다." },
  x3: { name: "301 게임", mark: "Ⓑ", better: "low", vLabel: "남은점수", hint: "태블릿의 최종 순위를 누르세요. 남은 점수는 적어도 되고 안 적어도 됩니다." },
};
const TASKS = [["p", "준비·정리"], ["j", "경기 진행"], ["s", "심판"]];

/* 스포츠다트 전용 Firebase 프로젝트 (kys5487-sportsdart, 2026-10-01 생성). 기록은 darts 아래에 저장 */
const FB_CFG = {
  apiKey: "AIzaSyAZRqsz79zak73EF0o65zP0pOPDX3JWLh0",
  authDomain: "kys5487-sportsdart.firebaseapp.com",
  databaseURL: "https://kys5487-sportsdart-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kys5487-sportsdart",
  storageBucket: "kys5487-sportsdart.firebasestorage.app",
  messagingSenderId: "249173082121",
  appId: "1:249173082121:web:f82eb88bafe699d777b8d8",
};
const ROOT = "darts";

/* ---------- 작은 도구 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const numSort = (a, b) => String(a).localeCompare(String(b), "ko", { numeric: true });
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- 상태 ----------
   S.rosters[반] = [{no,name,sex,seed}]
   S.classes[반] = { absent:{sid:true}, groups:{cu|x3:{list:[{m:[sid],tag}],method,ts}},
                    games:{cu|x3:{r1:{g0:{sid:{v,r,m}}, mk:{…}}}}, task:{sid:{p,j,s}} }   */
const TEST = new URLSearchParams(location.search).has("local") ? "-test" : "";
const LS = "darts-v1" + TEST, LSP = "darts-pending-v1" + TEST, LSU = "darts-ui-v1" + TEST;
let S = lsGet(LS) || {};
S.rosters ||= {}; S.classes ||= {}; S.settings ||= {};
let pending = new Set(lsGet(LSP) || []);
const params = new URLSearchParams(location.search);
const VIEW = params.has("view");                 // 학생용 보기 전용
const GRP = params.get("grp");                   // 조 입력 전용 링크 (?cls=1-3&grp=2)
const ui = Object.assign({ tab: "groups", cls: "", stage: "cu", round: 1, sel: null, method: { cu: "seed", x3: "grank" }, split: false, sort: "no", gsort: "best" }, lsGet(LSU) || {});
ui.sel = null; ui.open = {};   // 접는 칸(오늘 빠지는 학생·편성 설정)을 열어 둔 채로 고를 수 있게
if (params.get("cls")) ui.cls = params.get("cls");

function parseSimple(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    const parts = line.trim().split(/[\t,]+|\s+/).filter(Boolean);
    if (!parts.length) return;
    let sex = "", seed = false;
    for (let i = parts.length - 1; i >= 1; i--) {
      const p = parts[i];
      if (p === "남" || p === "여") { sex = p; parts.splice(i, 1); }
      else if (/^(시드|Y|★|\*)$/i.test(p)) { seed = true; parts.splice(i, 1); }
    }
    if (parts.length >= 2 && /^\d+$/.test(parts[0])) out.push({ no: parts[0], name: parts.slice(1).join(" "), sex, seed });
    else out.push({ no: String(out.length + 1), name: parts.join(" "), sex, seed });
  });
  return out;
}
/* 학년 전체 명렬표(엑셀 복사) — 타바타 앱과 같은 방식: '성명' 열을 기준으로 반을 나눈다 */
const STATUS_WORDS = ["자퇴", "전출", "위탁", "공석", "휴학"];
function parseBulk(text) {
  const rows = text.split(/\r?\n/).map(l => l.split("\t").map(c => c.trim()));
  const norm = s => (s || "").replace(/\s+/g, "");
  let hr = -1, nameCols = [];
  rows.forEach((row, r) => { const cols = []; row.forEach((c, i) => { if (norm(c) === "성명") cols.push(i); }); if (cols.length > nameCols.length) { nameCols = cols; hr = r; } });
  if (hr < 0) return null;
  const hdr = rows[hr], noCols = [];
  hdr.forEach((c, i) => { if (norm(c) === "번호") noCols.push(i); });
  const res = {};
  nameCols.forEach(nc => {
    let noCol = -1; noCols.forEach(c => { if (c < nc && (noCol < 0 || c > noCol)) noCol = c; });
    const sexCol = norm(hdr[nc + 1]) === "성별" ? nc + 1 : -1;
    let cls = "";
    for (let up = hr - 1; up >= 0 && !cls; up--) for (let c = nc; c >= Math.max(0, nc - 2); c--) {
      const v = (rows[up] && rows[up][c]) || ""; if (/^\s*\d+\s*[-–—]\s*\d+/.test(v)) { cls = norm(v).match(/^\d+[-–—]\d+/)[0].replace(/[–—]/, "-"); break; }
    }
    if (!cls) return;
    const list = [];
    for (let r = hr + 1; r < rows.length; r++) {
      const name = (rows[r][nc] || "").trim(), no = noCol >= 0 ? (rows[r][noCol] || "").trim() : "";
      if (!name && !no) break;
      if (!name || name === "-") continue;
      const sx = sexCol >= 0 ? (rows[r][sexCol] || "").trim() : "";
      if (STATUS_WORDS.includes(sx)) continue;
      list.push({ no: no || String(list.length + 1), name, sex: sx === "남" || sx === "여" ? sx : "", seed: false });
    }
    if (list.length) res[cls] = list;
  });
  return Object.keys(res).length ? res : null;
}

/* ---------- 경기 결과 계산 ---------- */
const groupsOf = (cls, stage) => (((C(cls).groups || {})[stage] || {}).list || []).map(g => ({ m: (g.m || []).slice(), tag: g.tag || "" }));
const roundRes = (cls, stage, r) => (((C(cls).games || {})[stage] || {})["r" + r]) || {};
function ptsOf(rank, n) {
  if (!(rank >= 1)) return 0;
  n = Math.max(n || 4, rank);
  if (n === 1) return 4;
  return Math.floor(1 + 3 * (n - rank) / (n - 1) + 0.5);

const ptsRow = n => Array.from({ length: n }, (_, i) => ptsOf(i + 1, n)).join("·");
/* 이 결과 칸에서 실제로 순위가 매겨진 인원 (보충 경기는 함께 던진 조 인원 n) */
const playedIn = (res, gk, x) => gk === "mk" ? (x.n || 4) : Object.values(res || {}).filter(y => y && y.r >= 1).length;
const convArea = sum => CFG.conv.find(([min]) => sum >= min)[1];
const convTotal = t => CFG.total.find(([min]) => t >= min)[1];

/* 학생 한 명의 영역 기록: 라운드마다 {rank, pts, v} */
function record(cls, stage, sid) {
  const rounds = [];
  for (let r = 1; r <= CFG.rounds; r++) {
    const rr = roundRes(cls, stage, r);
    let hit = null;
    for (const gk in rr) { const x = (rr[gk] || {})[sid]; if (x && x.r >= 1) { const n = playedIn(rr[gk], gk, x); hit = { rank: x.r, n, pts: ptsOf(x.r, n), v: x.v, gk }; break; } }
    rounds.push(hit);
  }
  const played = rounds.filter(Boolean).length;
  const sum = rounds.reduce((a, x) => a + (x ? x.pts : 0), 0);
  const vsum = rounds.reduce((a, x) => a + (x && typeof x.v === "number" ? x.v : 0), 0);

/* 한 조 결과의 자동 순위: 점수가 있는 사람끼리 비교, 같은 점수는 같은 순위.

function autoRank(res, better) {
  const auto = Object.entries(res).filter(([, x]) => !x.m && typeof x.v === "number");
  auto.forEach(([sid, x]) => {
    const beat = auto.filter(([, y]) => better === "high" ? y.v > x.v : y.v < x.v).length;
    x.r = beat + 1;
  });
  Object.values(res).forEach(x => { if (!x.m && typeof x.v !== "number") delete x.r; });
  return res;
}

function sizes(n, size, boards, fit) {
  if (!n) return [];

  if (fit && boards && k > boards) k = Math.max(boards, Math.ceil(n / CFG.maxGroup));   // 다트 수에 맞춰 5명 조 허용
  const base = Math.floor(n / k), extra = n % k;

function chunk(list, sz) { const out = []; let i = 0; sz.forEach(s => { out.push(list.slice(i, i + s)); i += s; }); return out; }
/* 카운트업 성적 순으로 줄 세우기 (합산 승점 → 총점 → 무작위) */
function byCU(cls, list) {
  const rec = {}; list.forEach(st => rec[sidOf(st)] = record(cls, "cu", sidOf(st)));
  return shuffle(list).sort((a, b) => { const A = rec[sidOf(a)], B = rec[sidOf(b)]; return B.sum - A.sum || B.vsum - A.vsum; });
}
/* 카운트업 '조별 순위'끼리 (각 조 1위끼리, 2위끼리 …) */
function byGroupRank(cls, list) {
  const ids = new Set(list.map(sidOf)), place = {};
  groupsOf(cls, "cu").forEach(g => {
    const mem = g.m.filter(s => ids.has(s)).map(s => ({ s, ...record(cls, "cu", s) }));
    shuffle(mem).sort((a, b) => b.sum - a.sum || b.vsum - a.vsum).forEach((x, i) => place[x.s] = i + 1);
  });
  const rec = {}; list.forEach(st => rec[sidOf(st)] = record(cls, "cu", sidOf(st)));
  return shuffle(list).sort((a, b) => (place[sidOf(a)] || 9) - (place[sidOf(b)] || 9) || rec[sidOf(b)].sum - rec[sidOf(a)].sum || rec[sidOf(b)].vsum - rec[sidOf(a)].vsum);
}
function makeGroups(cls, stage, method) {
  const present = roster(cls).filter(st => !isAbs(cls, sidOf(st)));
  const pools = [["", present]];   // 남녀 구분 없이 편성 — 여학생은 투구거리로 핸디캡
  const out = [];
  pools.forEach(([tag, list]) => {
    const sz = sizes(list.length, CFG.size, boardsOf(cls).length, fitOn());
    let gs;
    if (method === "seed") {
      gs = sz.map(() => []);
      shuffle(list.filter(s => s.seed)).forEach((s, i) => gs[i % gs.length].push(s));
      const rest = shuffle(list.filter(s => !s.seed));
      gs.forEach((g, i) => { while (g.length < sz[i] && rest.length) g.push(rest.pop()); });
      gs = shuffle(gs);
    } else {
      const ordered = method === "random" ? shuffle(list) : method === "no" ? list : method === "rank" ? byCU(cls, list) : byGroupRank(cls, list);
      gs = chunk(ordered, sz);
    }
    gs.forEach(g => out.push({ m: g.map(sidOf), tag }));
  });
  return out;
}

/* 🏆 학년 전체 카운트 업 순위 — 반을 넘어 같은 학년 모두를 점수로 줄 세운다.

let gradeRows = [];
function scGrade() {

function openBig(cls) {

}
/* 10대 경기장 전체를 한 화면에 — 같이 수업하는 반을 골라 함께 띄운다 */
function showBig() {
  const st = ui.stage, show = (ui.bigCls || [ui.cls]).filter(c => S.rosters[c]);

    groupsOf(c, st).forEach((g, gi) => {
      const names = g.m.filter(s => !isAbs(c, s)).map(s => { const x = sm[s] || { name: "?" }; return esc(x.name) + sexBadge(x); });
      const b = boardOf(c, gi), w = waveOf(c, gi);
      if (w === wv) (slot[b] ||= []).push({ c, names, gi });
      else if (w === wv + 1) (next[b] ||= []).push({ c, names });

  });
  const pick = classNames().filter(c => groupsOf(c, st).length);
  $("big").innerHTML = `<div class="bigTop"><h2>🎯 ${STAGES[st].name}${maxW > 1 ? ` · ${wv}차 경기` : ""}</h2>
    ${Object.entries(STAGES).map(([k, s]) => `<button class="${st === k ? "on" : ""}" data-act="bigStage" data-v="${k}">${s.mark} ${s.name}</button>`).join("")}
    ${maxW > 1 ? `<span style="width:12px"></span>` + Array.from({ length: maxW }, (_, i) => i + 1).map(w => `<button class="${wv === w ? "on" : ""}" data-act="bigWave" data-v="${w}">${w}차</button>`).join("") : ""}
    <span style="width:12px"></span>${pick.map(c => `<button class="${show.includes(c) ? "on" : ""}" data-act="bigCls" data-v="${esc(c)}">${esc(c)}반</button>`).join("")}
    <button class="btn close" data-act="closeBig">닫기</button><button class="btn" style="background:#F97316;color:#fff;border:0" data-act="bigEntry">✏️ 결과 입력</button></div>
    <div class="arena" style="grid-template-columns:repeat(${onBoards().length <= 5 ? onBoards().length : Math.ceil(onBoards().length / 2)},1fr)">${onBoards().map(b => { const g = slot[b] || [];
      return `<div class="bd2 ${g.length ? "" : "empty"} ${g.length > 1 ? "clash" : ""}" ${g.length === 1 ? `data-act="bigGo" data-c="${esc(g[0].c)}" data-g="${g[0].gi}"` : ""}><div class="hd"><span class="n">${b}</span>${g.length ? `<span class="c">${g.map(x => esc(x.c) + "반").join(" / ")}${g.length > 1 ? "<br>⚠ 겹침" : ""}</span>` : `<span class="c" style="color:#7A9C96">비어 있음</span>`}</div>

        ${next[b] ? `<div class="nx">다음 ${wv + 1}차 → ${next[b].flatMap(x => x.names).join(" · ")}</div>` : ""}</div>`; }).join("")}</div>`;

/* ---------- 동작 ---------- */
function saveGroups(cls, st, list, method) {
  const prev = (C(cls).groups || {})[st] || {};
  put(P(cls, "groups", st), { list, method: method || prev.method || "", ts: Date.now() });
}
function writeCard(gk, res) {
  // 보충 경기는 다른 조에 끼어 던진 순위를 선생님이 직접 누른다 — 혼자 1위가 되지 않게 자동 순위를 쓰지 않는다
  if (gk !== "mk") autoRank(res, STAGES[ui.stage].better);
  Object.keys(res).forEach(s => { const x = res[s]; if (x.r == null && typeof x.v !== "number" && gk !== "mk") delete res[s]; });
  put(P(ui.cls, "games", ui.stage, "r" + ui.round, gk), Object.keys(res).length ? res : null);
}
const curCard = gk => JSON.parse(JSON.stringify(roundRes(ui.cls, ui.stage, ui.round)[gk] || {}));

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, cls = ui.cls;
  switch (act) {
    case "tab": ui.tab = v; ui.sel = null; ui.focus = null; if (v === "entry") ui.round = openRound(cls, ui.stage); render(); scrollTo(0, 0); break;
    case "stage": ui.stage = v; ui.sel = null; ui.focus = null; ui.round = openRound(cls, v); render(); break;
    case "cls": ui.open = {}; ui.cls = v; ui.focus = null; ui.round = openRound(v, ui.stage); render(); break;
    case "goEntry": ui.tab = "entry"; ui.focus = null; ui.round = openRound(cls, ui.stage); render(); scrollTo(0, 0); break;
    case "toX3": ui.tab = "groups"; ui.stage = "x3"; render(); scrollTo(0, 0); break;
    case "bigEntry": $("big").classList.remove("show"); ui.tab = "entry"; ui.focus = null; ui.round = openRound(cls, ui.stage); render(); scrollTo(0, 0); break;
    case "bigGo": {
      $("big").classList.remove("show");
      ui.cls = b.dataset.c; ui.tab = "entry"; ui.focus = "g" + b.dataset.g; ui.round = openRound(ui.cls, ui.stage); render();
      const el = $("card-" + ui.focus); if (el) el.scrollIntoView({ block: "center" });
      break;
    }
    case "round": ui.round = +v; render(); if (b.closest(".banner")) scrollTo(0, 0); break;
    case "method": ui.method[ui.stage] = v; render(); break;
    case "sort": ui.sort = v; render(); break;
    case "gsort": ui.gsort = v; render(); break;
    case "abs": setAbs(cls, v, !isAbs(cls, v)); break;
    case "allIn": put(P(cls, "absent"), null); break;
    case "seed": {
      const list = (S.rosters[cls] || []).map(st => String(st.no) === v ? { ...st, seed: !st.seed } : st);
      put("rosters/" + cls, list); break;
    }
    case "import": doImport(); break;
    case "delCls":
      if (confirm(`${cls}반 명렬과 모든 기록을 지울까요? 되돌릴 수 없습니다.`)) { put("rosters/" + cls, null, true); put(P(cls), null); }
      break;
    case "make": {
      const st = ui.stage;
      // 다시 편성 = 이 경기를 1라운드부터 새로. 몇 명만 옮길 땐 학생을 눌러 옮기면 결과가 남는다
      const had = hasAny(cls, st);
      if (had && !confirm(`이미 입력한 ${STAGES[st].name} 결과가 있습니다.\n다시 편성하면 ${STAGES[st].name} 결과가 모두 지워지고 1라운드부터 새로 합니다.\n\n학생 몇 명만 옮기려면 [취소]를 누르고 학생을 눌러 옮기세요.`)) return;
      if (!had && groupsOf(cls, st).length && !confirm("조를 다시 편성할까요?")) return;
      if (had) put(P(cls, "games", st), null, true);
      const list = makeGroups(cls, st, ui.method[st]);
      if (!list.length) { toast("출석한 학생이 없습니다"); return; }
      ui.sel = null; saveGroups(cls, st, list, ui.method[st]); toast(`${list.length}개 조로 편성했습니다`);
      openBig(cls); // 편성하면 바로 프로젝터 화면으로
      break;
    }
    case "pick": {
      if (!ui.sel) { ui.sel = v; render(); break; }
      if (ui.sel === v) { ui.sel = null; render(); break; }
      const list = groupsOf(cls, ui.stage), a = ui.sel;
      const ga = list.find(g => g.m.includes(a)), gb = list.find(g => g.m.includes(v));
      ga.m[ga.m.indexOf(a)] = v; gb.m[gb.m.indexOf(v)] = a;
      ui.sel = null; saveGroups(cls, ui.stage, list); break;
    }
    case "moveTo": {
      const list = groupsOf(cls, ui.stage), a = ui.sel;
      list.forEach(g => g.m = g.m.filter(s => s !== a)); list[+v].m.push(a);
      ui.sel = null; saveGroups(cls, ui.stage, list); break;
    }
    case "selCancel": ui.sel = null; render(); break;
    case "selAbs": { const s = ui.sel; ui.sel = null; setAbs(cls, s, !isAbs(cls, s)); break; }
    case "newGrpWith": {

    }
    case "delGrp": {

      const i = +v, st = ui.stage, list = groupsOf(cls, st);

      list.splice(i, 1);
      const games = JSON.parse(JSON.stringify((C(cls).games || {})[st] || {}));
      Object.keys(games).forEach(rk => {
        const r = games[rk] || {}, out = {};
        Object.keys(r).forEach(k => { const m = /^g(d+)$/.exec(k); if (!m) { out[k] = r[k]; return; } const j = +m[1]; if (j < i) out[k] = r[k]; else if (j > i) out["g" + (j - 1)] = r[k]; });
        games[rk] = out;
      });
      put(P(cls, "games", st), games, true); saveGroups(cls, st, list); break;
    }
    case "addGrp": { const list = groupsOf(cls, ui.stage); list.push({ m: [], tag: "" }); put(P(cls, "groups", ui.stage, "list"), list); break; }
    case "big": openBig(cls); break;
    case "bigWave": ui.wave = +v; showBig(); break;
    case "bigCls": { const s = new Set(ui.bigCls || []); s.has(v) ? s.delete(v) : s.add(v); if (!s.size) s.add(cls); ui.bigCls = [...s]; saveUI(); showBig(); break; }
    case "bigStage": ui.stage = v; render(); showBig(); break;
    case "board": {
      const s = new Set(boardsOf(cls)), n = +v;
      if (!(C(cls).boards || []).length) s.clear(), s.add(n);   // 처음 누르면 그 위치만 고르기 시작
      else if (s.has(n)) { if (s.size === 1) { toast("한 대 이상 골라야 합니다"); return; } s.delete(n); } else s.add(n);
      put(P(cls, "boards"), [...s].sort((a, b) => a - b)); break;
    }
    case "fit": ui.fit = v === "1"; render(); break;
    case "bmode": ui.bmode = v; render(); break;
    case "power": {
      const n = +v, off = { ...((S.settings || {}).off || {}) };
      if (!isOff(n) && allBoards().filter(x => !isOff(x)).length === 1) { toast("한 대는 켜 두어야 합니다"); return; }
      if (isOff(n)) delete off["b" + n]; else off["b" + n] = true;
      put("settings/off", Object.keys(off).length ? off : null); break;
    }
    case "bcount": put("settings/count", Math.min(20, Math.max(1, boardCount() + +v))); break;
    case "boardsSet": put(P(cls, "boards"), v ? v.split(",").map(Number) : null); break;
    case "closeBig": $("big").classList.remove("show"); break;
    case "rank": {
      const gk = b.dataset.g, s = b.dataset.s, res = curCard(gk), x = res[s] || {};
      if (x.r === +v && x.m) { delete x.r; delete x.m; } else { x.r = +v; x.m = true; }
      res[s] = x; writeCard(gk, res); break;
    }
    case "mkn": { const res = curCard("mk"), x = res[b.dataset.s] || {}; x.n = +v; res[b.dataset.s] = x; writeCard("mk", res); break; }
    case "clearCard": {
      if (!confirm("이 조의 이번 라운드 결과를 지울까요?")) return;
      put(P(cls, "games", ui.stage, "r" + ui.round, b.dataset.g), null); break;
    }
    case "autoCard": { const res = curCard(b.dataset.g); Object.values(res).forEach(x => delete x.m); writeCard(b.dataset.g, res); break; }
    case "toMk": { const res = curCard("mk"); res[v] = { add: 1 }; put(P(cls, "games", ui.stage, "r" + ui.round, "mk"), res); break; }
    case "task": {
      const k = b.dataset.k, on = ((C(cls).task || {})[v] || {})[k];
      put(P(cls, "task", v, k), on ? null : 1); break;
    }
    case "xlsx": downloadXLSX(); break;
    case "gcsv": {
      const csv = "\uFEFF" + [["순위", "반", "번호", "이름", "최고 점수", "3R 합계", "평균", "라운드 수"], ...gradeRows.map(r => [r.rank, r.c, r.st.no, r.st.name, r.best, r.total, r.avg.toFixed(1), r.n])].map(r => r.join(",")).join("\r\n");
      download(`카운트업_학년순위_${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv"); break;
    }
    case "print": print(); break;
    case "copy": copy($(v).value); break;
    case "copyGrp": copy(`${location.origin}${location.pathname}?cls=${encodeURIComponent(cls)}&grp=${v}`); break;
    case "backup": download(`다트리그_백업_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S, null, 1), "application/json"); break;
    case "resetGames":
      if (confirm(`${cls}반의 경기 결과와 과제수행 체크를 모두 지울까요? 되돌릴 수 없습니다.`)) { put(P(cls, "games"), null, true); put(P(cls, "task"), null); }
      break;
    case "resetGroups":
      if (confirm(`${cls}반 조 편성을 지울까요?`)) put(P(cls, "groups"), null);
      break;
  }
});
/* 점수 입력 — 칸을 벗어나거나 엔터를 치면 저장하고 다음 칸으로 */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "clsSel") { ui.cls = t.value; ui.sel = null; render(); return; }
  if (t.id === "restore") { restore(t.files[0]); return; }
  if (!t.classList.contains("vin")) return;
  const gk = t.dataset.g, s = t.dataset.s, res = curCard(gk), x = res[s] || {};
  const raw = t.value.trim();
  if (raw === "") delete x.v; else { const n = Math.round(+raw); if (!Number.isFinite(n) || n < 0) { toast("0 이상의 숫자를 적어 주세요"); return; } x.v = n; }
  delete x.m;   // 점수를 고치면 자동 순위로 돌아간다
  res[s] = x;
  const inputs = [...document.querySelectorAll(".vin:not(:disabled)")], idx = inputs.indexOf(t);
  const nextKey = inputs[idx + 1] ? inputs[idx + 1].dataset.g + "|" + inputs[idx + 1].dataset.s : null;
  renderLater = false;
  writeCard(gk, res);
  if (nextKey && e.isTrusted && t.dataset.enter) {
    const [g2, s2] = nextKey.split("|"); const n2 = document.querySelector(`.vin[data-g="${g2}"][data-s="${s2}"]`); if (n2) n2.focus();
  }
});
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.k; if (k) ui.open[k] = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("vin")) { e.target.dataset.enter = "1"; e.target.blur(); }
  if (e.key === "Escape") $("big").classList.remove("show");
});
// blur 로 change 가 일어난 뒤 다음 칸으로 — Enter 로 끝냈을 때만
document.addEventListener("focusout", e => {
  const t = e.target;
  if (!(t.classList && t.classList.contains("vin") && t.dataset.enter)) return;
  const g = t.dataset.g, s = t.dataset.s;
  setTimeout(() => {
    const inputs = [...document.querySelectorAll(".vin:not(:disabled)")];
    const i = inputs.findIndex(x => x.dataset.g === g && x.dataset.s === s);
    if (inputs[i + 1]) inputs[i + 1].focus();
  }, 30);
});
$("clsSel").addEventListener("change", e => { ui.cls = e.target.value; ui.focus = null; if (ui.tab === "entry") ui.round = openRound(ui.cls, ui.stage); render(); });

function doImport() {
  const text = $("paste").value; if (!text.trim()) { toast("명렬표를 붙여넣어 주세요"); return; }
  const bulk = text.includes("\t") ? parseBulk(text) : null;
  if (bulk) {
    const names = Object.keys(bulk).sort(numSort);
    const exist = names.filter(c => S.rosters[c]);
    if (!confirm(`${names.length}개 반 (${names.join(", ")}) 을 등록합니다.${exist.length ? `\n이미 있는 ${exist.join(", ")}반은 새 명렬로 바뀝니다(시드 표시는 유지).` : ""}`)) return;
    names.forEach(c => {
      const old = {}; (S.rosters[c] || []).forEach(st => old[st.no] = st.seed);
      put("rosters/" + c, bulk[c].map(st => ({ ...st, seed: !!old[st.no] })), true);
    });
    ui.cls = names[0]; render(); toast(`${names.length}개 반 등록 완료`);
    return;
  }
  const cls = ($("newCls").value || "").trim().replace(/반$/, "");
  if (!cls) { toast("반 이름을 적어 주세요 (예: 1-3)"); return; }
  if (/[.#$\[\]\/]/.test(cls)) { toast("반 이름에 . # $ [ ] / 는 쓸 수 없습니다"); return; }
  const list = parseSimple(text);
  if (!list.length) { toast("학생을 읽지 못했습니다"); return; }
  if (S.rosters[cls] && !confirm(`${cls}반 명렬을 새 명단(${list.length}명)으로 바꿀까요?`)) return;
  ui.cls = cls; put("rosters/" + cls, list); toast(`${cls}반 ${list.length}명 등록`);
}
/* 엑셀 — 첫 시트 '최종점수'(모든 반, 성적 입력용) + 반마다 시트 하나(라운드별 경기 결과 → Ⓐ·Ⓑ·Ⓒ → 최종 점수) */
let xlsxLib = null;
async function loadXLSX() {
  if (xlsxLib) return xlsxLib;
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  return (xlsxLib = window.XLSX);
}
function studentRow(cls, st) {
  const s = sidOf(st), a = record(cls, "cu", s), b = record(cls, "x3", s);
  const t = (C(cls).task || {})[s] || {}, c = taskPts(cls, s), tot = a.area + b.area + c;
  const miss = [];
  if (a.played < CFG.rounds) miss.push(`카운트업 ${CFG.rounds - a.played}R 미응시`);
  if (b.played < CFG.rounds) miss.push(`301 ${CFG.rounds - b.played}R 미응시`);
  return { s, a, b, t, c, tot, grade: convTotal(tot), note: miss.join(" / ") };
}
async function downloadXLSX() {
  let X;
  try { X = await loadXLSX(); } catch (e) { toast("엑셀 도구를 불러오지 못했습니다 — 인터넷 연결을 확인하세요"); return; }
  const wb = X.utils.book_new(), date = today();
  const R = CFG.rounds, dash = v => v === undefined || v === null || v === "" ? "" : v;

  // ① 최종점수 — 모든 반
  const sum = [["반", "번호", "이름", "Ⓐ 카운트 업", "Ⓑ 301 게임", "Ⓒ 과제수행", "Ⓐ+Ⓑ+Ⓒ", "최종 점수", "비고"]];
  classNames().forEach(cls => roster(cls).forEach(st => {
    const r = studentRow(cls, st);
    sum.push([cls, +st.no || st.no, st.name, r.a.played ? r.a.area : 0, r.b.played ? r.b.area : 0, r.c, r.tot, r.grade, r.note]);
  }));
  const ws0 = X.utils.aoa_to_sheet(sum);
  ws0["!cols"] = [6, 6, 10, 12, 12, 12, 10, 10, 28].map(w => ({ wch: w }));
  X.utils.book_append_sheet(wb, ws0, "최종점수");

  // ② 반마다 시트
  classNames().forEach(cls => {
    const top = ["번호", "이름"], sub = ["", ""], merges = [{ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }, { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } }];
    const group = (title, cols) => { const c0 = top.length; top.push(title, ...Array(cols.length - 1).fill("")); sub.push(...cols); merges.push({ s: { r: 0, c: c0 }, e: { r: 0, c: c0 + cols.length - 1 } }); };
    for (let i = 1; i <= R; i++) group(`Ⓐ 카운트 업 ${i}R`, ["점수", "순위", "인원", "승점"]);
    group("Ⓐ 결과", ["합산 승점", "Ⓐ 점수"]);
    for (let i = 1; i <= R; i++) group(`Ⓑ 301 ${i}R`, ["순위", "남은점수", "인원", "승점"]);
    group("Ⓑ 결과", ["합산 승점", "Ⓑ 점수"]);
    group("Ⓒ 과제수행", [...TASKS.map(t => t[1]), "Ⓒ 점수"]);
    group("최종", ["Ⓐ+Ⓑ+Ⓒ", "최종 점수", "비고"]);
    const rows = [top, sub];
    roster(cls).forEach(st => {
      const r = studentRow(cls, st), row = [+st.no || st.no, st.name];
      r.a.rounds.forEach(x => row.push(x ? dash(x.v) : "", x ? x.rank : "", x ? x.n : "", x ? x.pts : ""));
      row.push(r.a.sum, r.a.played ? r.a.area : 0);
      r.b.rounds.forEach(x => row.push(x ? x.rank : "", x ? dash(x.v) : "", x ? x.n : "", x ? x.pts : ""));
      row.push(r.b.sum, r.b.played ? r.b.area : 0);
      row.push(...TASKS.map(([k]) => r.t[k] ? 1 : 0), r.c, r.tot, r.grade, r.note);
      rows.push(row);
    });
    const ws = X.utils.aoa_to_sheet(rows);
    ws["!merges"] = merges;
    ws["!cols"] = top.map((_, i) => ({ wch: i === 1 ? 10 : i === top.length - 1 ? 26 : 8 }));
    X.utils.book_append_sheet(wb, ws, String(cls).replace(/[\[\]:*?\/\\]/g, "-").slice(0, 28) + "반");
  });
  X.writeFile(wb, `스포츠다트_수행평가_${date}.xlsx`);
  toast("엑셀을 내려받았습니다");
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function copy(text) { navigator.clipboard.writeText(text).then(() => toast("복사했습니다"), () => prompt("복사하세요", text)); }
function restore(file) {
  if (!file) return;
  file.text().then(t => {
    const v = JSON.parse(t);
    if (!v || !v.rosters) throw 0;
    if (!confirm("백업으로 전체 자료를 바꿀까요? 지금 자료는 사라집니다.")) return;
    put("rosters", v.rosters, true); put("settings", v.settings || null, true); put("classes", v.classes || {}); toast("백업을 불러왔습니다");
  }).catch(() => toast("백업 파일을 읽지 못했습니다"));
}

render();
updStatus();
if (!params.has("local")) initFB();   // ?local=1 — 서버에 올리지 않고 이 기기에서만 시험
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
