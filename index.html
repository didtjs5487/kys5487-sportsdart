<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E7F8">
<title>스포츠다트 리그</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="다트리그">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* 타바타 앱과 같은 디자인 언어 — 연보라 바탕 · 흰 카드 · 남색 글자 · 보라 강조 · Barlow 숫자.
     다만 노안을 고려해 글씨는 크게(본문 18px, 보조 15px 이상), 보조 글자색은 타바타보다 진하게. */
  :root{
    --bg:#E9E7F8; --panel:#FFFFFF; --soft:#F3F1FD; --line:#E4E1F5; --line2:#D6D1F0;
    --ink:#2B3160; --sub:#5E6493;
    --pri:#5B51E8; --pri2:#8B80F9; --priSoft:#ECEAFD;
    --cu:#FF9F1C; --cuInk:#5A3300; --cuSoft:#FFF1DC;
    --x3:#2EC4B6; --x3Ink:#08423D; --x3Soft:#DDF6F3;
    --good:#2E9E60; --goodSoft:#E3F6EB; --bad:#E5485A; --badSoft:#FDE7EA;
    --warn:#A86A00; --warnSoft:#FFF4D6;
    --r1:#D3960A; --r1Soft:#FFF3D1;
    --shadow:0 8px 24px rgba(91,81,232,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:"Barlow","Noto Sans KR",system-ui,sans-serif; font-size:18px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; padding-bottom:40px}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1100px; margin:0 auto; padding:0 16px}
  .num, .prow input, .ranks .pts, td.grade, td.sum, .bd, #big .bd2 .n, #big .joinQR b, .codeIn{font-family:"Barlow Condensed","Noto Sans KR",sans-serif; font-variant-numeric:tabular-nums}

  /* 머리글 — 타바타처럼 바탕 위에 제목, 오른쪽에 알약 모양 상태 */
  header{background:var(--bg); position:sticky; top:0; z-index:20}
  header .wrap{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-top:calc(14px + env(safe-area-inset-top)); padding-bottom:8px;
    padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
  header h1{margin:0; font-family:"Barlow Condensed","Noto Sans KR",sans-serif; font-size:28px; font-weight:700; letter-spacing:.5px; white-space:nowrap}
  header select{background:var(--panel); color:var(--pri); border:1px solid var(--line); border-radius:999px; font-size:20px; font-weight:800; padding:6px 14px; min-height:48px}
  #status{margin-left:auto; font-size:15px; font-weight:600; background:var(--panel); border:1px solid var(--line); color:var(--sub); border-radius:999px; padding:8px 14px; white-space:nowrap}
  #who{min-height:46px; border:0; border-radius:999px; background:var(--pri); color:#fff; font-size:16px; font-weight:700; padding:0 18px; white-space:nowrap}

  /* 탭 — 타바타의 폴더 탭 */
  nav{display:flex; gap:6px; overflow-x:auto; padding:6px 0 0}
  nav button{flex:0 0 auto; min-height:54px; background:var(--panel); color:var(--sub); border:1px solid var(--line); border-bottom:0;
    border-radius:12px 12px 0 0; font-size:18px; font-weight:700; padding:0 20px}
  nav button.on{background:var(--pri); color:#fff; border-color:var(--pri)}
  main{background:var(--panel); border:1px solid var(--line); border-radius:0 16px 16px 16px; padding:20px 18px 26px; min-height:60vh; box-shadow:var(--shadow)}

  h2{font-family:"Barlow Condensed","Noto Sans KR",sans-serif; font-size:26px; font-weight:700; letter-spacing:.3px; margin:4px 0 12px}
  h3{font-family:"Barlow Condensed","Noto Sans KR",sans-serif; font-size:22px; font-weight:700; letter-spacing:.3px; margin:18px 0 10px}
  .hint{color:var(--sub); font-size:16px; margin:6px 0 12px; line-height:1.6}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .sp{flex:1}
  .btn{min-height:52px; border:0; border-radius:12px; padding:0 20px; font-size:18px; font-weight:700; background:var(--soft); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
  .btn.pri{background:var(--pri); color:#fff; box-shadow:none}
  .btn.alt{background:var(--cu); color:var(--cuInk); box-shadow:none}
  .btn.ghost{background:var(--panel)}
  .btn.danger{background:var(--badSoft); color:var(--bad); box-shadow:none}
  .btn.big{min-height:60px; font-size:20px; padding:0 26px}
  .btn:disabled{opacity:.4; cursor:default}
  input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{border:1px solid var(--line2); border-radius:12px; background:var(--soft); padding:10px 12px; font-size:18px; min-height:52px; color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--pri); box-shadow:0 0 0 3px var(--priSoft); background:var(--panel)}
  textarea{width:100%; min-height:150px; font-size:16px; line-height:1.45}
  .card{border:1px solid var(--line); border-radius:16px; padding:16px; background:var(--panel)}
  .note{background:var(--warnSoft); color:#6B4A00; border-radius:12px; padding:12px 14px; font-size:16px; margin:10px 0}
  .ok{color:var(--good)} .bad{color:var(--bad)}

  /* 로그인 · 학생 입력 */
  #login{position:fixed; inset:0; background:rgba(28,32,66,.6); z-index:70; display:none; align-items:center; justify-content:center; padding:16px}
  #login.show{display:flex}
  #login .box{background:var(--panel); border-radius:18px; padding:22px; width:min(440px,100%); max-height:90vh; overflow:auto; box-shadow:0 20px 50px rgba(28,32,66,.3)}
  #login input{width:100%; margin-bottom:10px}
  .joinBox{background:var(--priSoft); border:1px solid #D3CEFB; border-radius:16px; padding:16px; margin-bottom:14px}
  .joinBox select,.joinBox input{width:100%; margin-bottom:10px; background:var(--panel)}
  .codeIn{font-size:36px!important; letter-spacing:10px; text-align:center; font-weight:700}

  /* 경기 고르기 · 라운드 */
  .seg{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .seg button{min-height:54px; border:1px solid var(--line); background:var(--soft); border-radius:12px; padding:0 20px; font-size:19px; font-weight:700; color:var(--sub)}
  .seg button.on.cu{background:var(--cu); border-color:var(--cu); color:var(--cuInk)}
  .seg button.on.x3{background:var(--x3); border-color:var(--x3); color:var(--x3Ink)}
  .seg button.on.plain{background:var(--pri); border-color:var(--pri); color:#fff}
  .seg button .done{font-family:"Barlow Condensed",sans-serif; font-size:17px; font-weight:600; margin-left:6px; opacity:.85}

  /* 명렬 */
  .stuGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
  .stu{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:14px; background:var(--soft); min-height:60px; padding:6px 6px 6px 12px}
  .stu .nm{flex:1; text-align:left; border:0; background:transparent; font-size:19px; font-weight:700; min-height:50px; padding:0}
  .stu .nm small{display:block; font-size:14px; font-weight:600; color:var(--sub)}
  .stu.abs{background:var(--panel); border-style:dashed}
  .stu.abs .nm{color:#A3A7C7; text-decoration:line-through}
  .star{width:50px; height:50px; border-radius:12px; border:0; background:var(--panel); font-size:22px; color:#C5C2E3}
  .star.on{background:var(--r1Soft); color:var(--r1)}

  /* 조 */
  .grpGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
  .grp{border:1px solid var(--line); border-radius:16px; padding:12px; background:var(--panel); box-shadow:var(--shadow)}
  .grp.cu{border-top:4px solid var(--cu)} .grp.x3{border-top:4px solid var(--x3)}
  .grp h4{margin:0 0 8px; font-size:21px; display:flex; align-items:center; gap:8px}
  .tag{font-size:15px; font-weight:700; border-radius:999px; padding:2px 10px; background:var(--soft); color:var(--sub); border:1px solid var(--line)}
  .chips{display:flex; flex-direction:column; gap:6px}
  .chip{display:flex; align-items:center; gap:8px; min-height:52px; border:1px solid var(--line); border-radius:12px; background:var(--soft);
    padding:0 12px; font-size:19px; font-weight:700; text-align:left; width:100%}
  .chip .no{color:var(--pri); font-family:"Barlow Condensed",sans-serif; font-weight:700; min-width:28px}
  .chip .info{margin-left:auto; font-size:15px; font-weight:600; color:var(--sub)}
  .chip.sel{border-color:var(--pri); background:var(--priSoft); box-shadow:0 0 0 3px #D3CEFB}
  .chip.abs{color:#A3A7C7; border-style:dashed; background:var(--panel)}
  .moveHere{margin-top:8px; width:100%}
  .sx{display:inline-block; font-size:14px; font-weight:700; color:#C2185B; background:#FCE4EF; border-radius:999px; padding:0 7px; margin-left:4px; vertical-align:2px}

  /* 다트 위치 */
  .boards{display:grid; grid-template-columns:repeat(10,1fr); gap:6px}
  .bd{min-height:58px; border:1px solid var(--line); border-radius:12px; background:var(--soft); font-size:24px; font-weight:700; color:#A3A7C7; line-height:1.1; padding:2px}
  .bd small{display:block; font-family:"Noto Sans KR",sans-serif; font-size:13px; font-weight:600}
  .bd.on{background:var(--pri); border-color:var(--pri); color:#fff}
  .bd.clash{background:var(--bad); border-color:var(--bad); color:#fff}
  .bd.dead{background:var(--panel); color:#C9C6E4; border-style:dashed; text-decoration:line-through}
  .bd.pw.on{background:var(--good); border-color:var(--good); color:#fff}
  .bd.pw.off{background:var(--panel); color:#A3A7C7; border-style:dashed}
  @media (max-width:560px){ .boards{grid-template-columns:repeat(5,1fr)!important} }

  .go{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
  .go .btn{min-height:68px; font-size:22px}
  .go .nextBig{background:var(--good)}
  details.setup{margin-bottom:14px}
  details.setup summary{cursor:pointer; min-height:54px; display:flex; align-items:center; font-size:18px; font-weight:700; color:var(--sub); background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:0 16px; margin-bottom:10px; list-style:none}
  details.setup summary::before{content:"▸"; margin-right:10px; color:var(--pri)}
  details.setup[open] summary{color:var(--pri)}
  details.setup[open] summary::before{content:"▾"}
  .banner{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--goodSoft); border:1px solid #BFE6CF; border-radius:14px; padding:12px 16px; margin-bottom:12px; font-size:19px; font-weight:700; color:var(--good)}
  .banner .btn:first-of-type{margin-left:auto}
  .banner.todo{background:var(--priSoft); border-color:#D3CEFB; color:var(--pri)}
  .selBar{position:sticky; top:80px; z-index:10; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--priSoft); border:1px solid #D3CEFB; border-radius:14px; padding:10px 12px; margin-bottom:12px; font-size:17px; box-shadow:var(--shadow)}
  .selBar b:first-child{font-size:19px}
  .absGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
  .absBtn{min-height:52px; border:1px solid var(--line); border-radius:12px; background:var(--soft); font-size:17px; font-weight:700; text-align:left; padding:4px 10px}
  .absBtn small{display:block; font-size:14px; color:var(--bad)}
  .absBtn.out{background:var(--badSoft); border-color:#F6B9C1; color:var(--bad); text-decoration:line-through}

  /* 경기 결과 카드 */
  .entryGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
  .ecard{border:1px solid var(--line); border-radius:16px; padding:14px; background:var(--panel); box-shadow:var(--shadow)}
  .ecard.done{border-color:#BFE6CF; box-shadow:inset 4px 0 0 var(--good), var(--shadow)}
  .ecard.focus{box-shadow:0 0 0 3px var(--pri), var(--shadow); border-color:var(--pri)}
  .ecard h4{margin:0 0 6px; font-size:21px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .ecard h4 .st{margin-left:auto; font-size:15px; font-weight:700}
  .prow{display:grid; grid-template-columns:1fr 108px; grid-template-rows:auto auto; gap:6px 8px; padding:10px 0; border-top:1px solid var(--line)}
  .prow:first-of-type{border-top:0}
  .prow .who{font-size:19px; font-weight:700; align-self:center}
  .prow .who small{font-family:"Barlow Condensed",sans-serif; font-weight:700; color:var(--pri); font-size:17px; margin-right:6px}
  .prow input{width:108px; text-align:center; font-size:26px; font-weight:700; padding:4px}
  .prow input::placeholder{font-family:"Noto Sans KR",sans-serif; font-size:16px; font-weight:500; color:#A3A7C7}
  .ranks{grid-column:1 / -1; display:flex; gap:6px; align-items:center}
  .ranks button{flex:1; min-height:50px; border:1px solid var(--line); border-radius:12px; background:var(--soft); font-size:18px; font-weight:700; color:var(--sub)}
  .ranks button.on{background:var(--pri); border-color:var(--pri); color:#fff}
  .ranks button.on.r1{background:var(--r1); border-color:var(--r1); color:#fff}
  .ranks .pts{min-width:62px; text-align:right; font-size:20px; font-weight:700; color:var(--pri)}
  .prow.abs .who{color:#A3A7C7}
  .prow.abs .ranks{display:none}
  .ecard .foot{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .ecard .foot .btn{min-height:48px; font-size:16px; padding:0 14px}
  .pickList{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
  .pickList button{min-height:50px; border:1px dashed var(--warn); background:var(--warnSoft); border-radius:12px; padding:0 14px; font-size:17px; font-weight:700; color:#6B4A00}
  .roles{margin-top:12px; background:var(--soft); border-radius:14px; padding:12px}
  .rtitle{font-size:17px; font-weight:700; margin-bottom:8px} .rtitle small{font-size:14px; font-weight:600; color:var(--sub); margin-left:6px}
  .refBox{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; background:var(--soft); border-radius:12px; padding:10px 12px; font-size:18px}
  .refBox.on{background:var(--goodSoft); color:#1E6B42}
  .refBox small{font-size:14px; color:var(--sub); font-weight:600}
  .refBox .btn{margin-left:auto; min-height:44px; font-size:15px}
  .rgrid{display:grid; grid-template-columns:minmax(72px,1fr) repeat(3, minmax(58px,76px)); gap:6px 6px; align-items:center}
  .rgrid .rh{font-size:14px; font-weight:700; color:var(--sub); text-align:center; line-height:1.2}
  .rgrid .rn{font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rgrid .rc{min-height:50px; width:100%; padding:0; border-radius:12px; font-size:24px; font-weight:800; background:var(--panel); border:1px solid var(--line2)}
  .rgrid .rc.on{background:var(--good); border-color:var(--good); color:#fff}
  .roles .roleAdd{width:100%; margin-top:10px; min-height:48px; font-size:16px; background:var(--panel)}
  .rowX{margin-left:8px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line2); background:var(--panel); color:var(--bad); font-size:18px; font-weight:800; vertical-align:middle}
  .lockTag{display:inline-block; background:var(--pri); color:#fff; font-size:20px; font-weight:700; border-radius:999px; padding:8px 18px; margin-bottom:12px}
  .rrow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px}
  .rrow .rl{min-width:80px; font-size:15px; font-weight:700; color:var(--sub)}
  .rc{min-height:44px; border:1px solid var(--line); border-radius:999px; background:var(--panel); font-size:16px; font-weight:700; padding:0 14px; color:var(--sub)}
  .rc.on{background:var(--good); border-color:var(--good); color:#fff}
  .rrow select{min-height:44px; font-size:15px; padding:4px 10px; background:var(--panel)}
  .byline{font-size:15px; color:var(--sub); font-weight:600}

  /* 순위·성적 */
  .tblWrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px}
  table{border-collapse:collapse; width:100%; font-size:17px; white-space:nowrap}
  th,td{border-bottom:1px solid var(--line); padding:9px 8px; text-align:center}
  th{background:var(--soft); color:var(--sub); font-size:16px; font-weight:700; position:sticky; top:0}
  th.cu{background:var(--cuSoft); color:var(--cuInk)} th.x3{background:var(--x3Soft); color:var(--x3Ink)}
  td.nm{text-align:left; font-weight:700}
  td.miss{background:var(--warnSoft); color:var(--warn); font-weight:700}
  td.sum{font-weight:700; font-size:19px}
  td.grade{font-weight:700; font-size:24px; color:var(--pri)}
  .tk{min-width:50px; min-height:46px; border:1px solid var(--line); border-radius:999px; background:var(--soft); font-size:15px; font-weight:700; color:#A3A7C7; margin:0 2px; padding:0 10px}
  .tk.on{background:var(--good); border-color:var(--good); color:#fff}
  .tk.auto{background:var(--goodSoft); border-color:#BFE6CF; color:var(--good)}

  /* 프로젝터 크게 보기 — 타바타 무대처럼 어두운 남색 */
  #big{position:fixed; inset:0; background:#141833; color:#fff; z-index:50; overflow:auto; padding:20px 16px; display:none}
  #big.show{display:block}
  #big h2{font-size:34px; margin:0 0 16px; display:flex; align-items:center; gap:12px; color:#fff}
  #big .close{margin-left:auto; background:#fff; color:var(--ink); box-shadow:none}
  #big .bigTop{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  #big .bigTop h2{margin:0; font-size:34px}
  #big .bigTop button{min-height:50px; border-radius:999px; border:1px solid #3A3F78; background:transparent; color:#C9C5FF; font-size:18px; font-weight:700; padding:0 16px}
  #big .bigTop button.on{background:var(--pri2); border-color:var(--pri2); color:#fff}
  #big .arena{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; min-height:calc(100vh - 130px); grid-auto-rows:1fr}
  #big .bd2{background:#1F2450; border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; min-width:0; border:2px solid #2C326A}
  #big .bd2.empty{opacity:.35}
  #big .nextBtn{background:var(--good)!important; color:#fff!important; border:0!important; font-size:20px!important}
  #big .doneBar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#1E5A3C; border:2px solid var(--good); color:#fff; border-radius:16px; padding:10px 16px; margin-bottom:12px; font-size:28px; font-weight:700}
  #big .doneBar .btn{margin-left:auto; min-height:60px; font-size:24px!important; padding:0 26px}
  #big .waitMsg{text-align:center; font-size:40px; font-weight:700; color:#fff; padding:18px 0 10px} #big .waitMsg small{display:block; font-size:22px; color:#C9C5FF; font-weight:600; margin-top:6px}
  #big .bd2[data-act]{cursor:pointer}
  #big .bd2[data-act]:hover{border-color:var(--pri2)}
  #big .bd2.clash{border-color:var(--bad)}
  #big .bd2 .hd{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  #big .bd2 .n{width:60px; height:60px; border-radius:50%; background:var(--pri); color:#fff; font-size:36px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none}
  #big .bd2 .c{font-size:20px; font-weight:700; color:var(--cu); line-height:1.2}
  #big .bd2 .nm{font-size:clamp(22px,2.3vw,36px); font-weight:700; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #big .bd2 .nm .sx{font-size:16px; vertical-align:4px}
  #big .bd2 .nx{margin-top:auto; padding-top:8px; border-top:1px dashed #3A3F78; font-size:18px; font-weight:600; color:#FFC876; line-height:1.4}
  #big .joinQR{display:flex; align-items:center; gap:12px; background:#fff; color:var(--ink); border-radius:14px; padding:6px 14px 6px 6px}

function parseSimple(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {

    if (!parts.length) return;
    let sex = "", seed = false;
    for (let i = parts.length - 1; i >= 1; i--) {

      if (p === "남" || p === "여") { sex = p; parts.splice(i, 1); }

/* 켜진 다트 — 고장 났거나 오늘 안 쓰는 다트는 꺼 두면 조 배정·화면에서 빠진다 */
function onBoards() { const on = allBoards().filter(n => !isOff(n)); return on.length ? on : allBoards(); }
/* 반이 고른 다트 위치는 그날만 쓴다 — 다음 수업(다른 날)에는 다시 켜진 다트 전체 (2026-10-05) */

    case "addGrp": { const list = groupsOf(cls, ui.stage); list.push({ m: [], tag: "" }); saveGroups(cls, ui.stage, list); break; }
    case "big": openBig(cls); break;
    case "bigWave": ui.wave = +v; showBig(); break;
    case "bigCls": { const s = new Set(ui.bigCls || []); s.has(v) ? s.delete(v) : s.add(v); if (!s.size) s.add(cls); ui.bigCls = [...s]; saveUI(); showBig(); break; }
    case "bigStage": ui.stage = v; ui.round = openRound(cls, v); render(); showBig(); break;
    case "board": {
      const s = new Set(boardsOf(cls)), n = +v;
      if (!chosenBoards(cls).length) s.clear(), s.add(n);   // 처음 누르면 그 위치만 고르기 시작
      else if (s.has(n)) { if (s.size === 1) { toast("한 대 이상 골라야 합니다"); return; } s.delete(n); } else s.add(n);
      put(P(cls, "boards"), { day: today(), list: [...s].sort((a, b) => a - b) }); break;
    }
    case "loginOpen": showLogin(); break;
    case "loginClose": $("login").classList.remove("show"); break;
    case "lgPick": $("lgEmail").value = v; $("lgPw").focus(); break;
    case "doLogin": {
      const em = ($("lgEmail").value || "").trim().toLowerCase(), pw = $("lgPw").value;
      if (!em || !pw) { toast("이메일과 비밀번호를 넣어 주세요"); return; }
      if (!fauth) { toast("인터넷 연결을 확인해 주세요"); return; }
      authM.signInWithEmailAndPassword(fauth, em, pw).then(u => {
        if (!TEACHERS.includes(em)) { toast("선생님 계정이 아닙니다"); authM.signOut(fauth); return; }
        $("login").classList.remove("show"); toast("로그인했습니다");
      }).catch(e => toast(/invalid|wrong|not-found|credential/.test(e.code || "") ? "이메일 또는 비밀번호가 맞지 않아요" : /too-many/.test(e.code || "") ? "시도가 많아 잠시 막혔어요" : /operation-not-allowed|configuration/.test(e.code || "") ? "Firebase에서 이메일 로그인을 먼저 켜 주세요" : "로그인 실패: " + (e.code || "")));
      break;
    }
    case "logout": authM.signOut(fauth).then(() => { $("login").classList.remove("show"); toast("로그아웃했습니다"); }); break;
    case "pwChange": {
      const np = $("lgNew").value || "";
      if (np.length < 6) { toast("6자 이상으로 정해 주세요"); return; }
      authM.updatePassword(fauth.currentUser, np).then(() => { toast("비밀번호를 바꿨습니다"); $("lgNew").value = ""; })
        .catch(e => toast(/recent-login/.test(e.code || "") ? "보안을 위해 로그아웃 후 다시 로그인한 뒤 바꿔 주세요" : "바꾸지 못했어요"));
      break;
    }
    case "join": joinStudent(); break;
    case "unjoin": stuOK = false; me = null; lsSet("darts-me" + TEST, null); if (fauth && fauth.currentUser && fauth.currentUser.isAnonymous) authM.signOut(fauth); render(); break;
    case "board1": { ui.board = +v; render(); const c = document.querySelector(".ecard"); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); break; }
    case "role": { const k = b.dataset.k, s = b.dataset.s; stampRoles(b.dataset.g, R => { R[k] ||= {}; if (R[k][s]) delete R[k][s]; else R[k][s] = 1; }); break; }
    case "fit": ui.fit = v === "1"; render(); break;
    case "bmode": ui.bmode = v; render(); break;
    case "power": {
      const n = +v, off = { ...((S.settings || {}).off || {}) };
      if (!isOff(n) && allBoards().filter(x => !isOff(x)).length === 1) { toast("한 대는 켜 두어야 합니다"); return; }
      if (isOff(n)) delete off["b" + n]; else off["b" + n] = true;
      put("settings/off", Object.keys(off).length ? off : null); break;
    }
    case "bcount": put("settings/count", Math.min(20, Math.max(1, boardCount() + +v))); break;
    case "boardsSet": put(P(cls, "boards"), v ? { day: today(), list: v.split(",").map(Number) } : null); break;
    case "closeBig": $("big").classList.remove("show"); break;
    case "rank": {
      const gk = b.dataset.g, s = b.dataset.s, res = curCard(gk), x = res[s] || {};
      if (x.r === +v && x.m) { delete x.r; delete x.m; } else { x.r = +v; x.m = true; }
      res[s] = x; writeCard(gk, res); break;
    }
    case "mkn": { const res = curCard("mk"), x = res[b.dataset.s] || {}; x.n = +v; res[b.dataset.s] = x; writeCard("mk", res); break; }
    case "clearCard": {
      if (!confirm(`이 다트의 ${ui.round}라운드 결과를 모두 지울까요?`)) return;
      put(P(cls, "games", ui.stage, "r" + ui.round, b.dataset.g), null); stampRoles(b.dataset.g); break;
    }
    case "clrRow": {
      const gk = b.dataset.g, res = curCard(gk), s = b.dataset.s, nm = (stuMap(cls)[s] || {}).name || "";
      if (!confirm(`${nm} 학생의 ${ui.round}라운드 결과를 지울까요?`)) return;
      if (gk === "mk") res[s] = { add: 1, n: (res[s] || {}).n }; else delete res[s];
      writeCard(gk, res); break;
    }
    case "autoCard": { const res = curCard(b.dataset.g); Object.values(res).forEach(x => delete x.m); writeCard(b.dataset.g, res); break; }
    case "toMk": { const res = curCard("mk"); res[v] = { add: 1 }; put(P(cls, "games", ui.stage, "r" + ui.round, "mk"), res); break; }
    case "task": {
      const k = b.dataset.k, rc = roleCounts(cls), now = taskOn(cls, v, k, rc), auto = ((rc[v] || {})[k] || 0) > 0;
      const want = !now;   // 누르면 반대로 — 자동 판정과 같아지면 직접 값은 지운다
      put(P(cls, "task", v, k), want === auto ? null : (want ? 1 : 0)); break;
    }
    case "xlsx": downloadXLSX(); break;
    case "gcsv": {
      const csv = "\uFEFF" + [["순위", "반", "번호", "이름", "최고 점수", "3R 합계", "평균", "라운드 수"], ...gradeRows.map(r => [r.rank, r.c, r.st.no, r.st.name, r.best, r.total, r.avg.toFixed(1), r.n])].map(r => r.join(",")).join("\r\n");
      download(`카운트업_학년순위_${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv"); break;
    }
    case "print": print(); break;
    case "copy": copy($(v).value); break;
    case "copyGrp": copy(`${location.origin}${location.pathname}?cls=${encodeURIComponent(cls)}&grp=${v}`); break;
    case "backup": download(`다트리그_백업_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S, null, 1), "application/json"); break;
    case "resetGames":
      if (confirm(`${cls}반의 경기 결과와 과제수행 체크를 모두 지울까요? 되돌릴 수 없습니다.`)) { put(P(cls, "games"), null, true); put(P(cls, "roles"), null, true); put(P(cls, "closed"), null, true); put(P(cls, "live"), null, true); put(P(cls, "task"), null); }
      break;
    case "resetGroups":
      if (confirm(`${cls}반 조 편성을 지울까요?`)) put(P(cls, "groups"), null);
      break;
  }
});
/* 점수 입력 — 칸을 벗어나거나 엔터를 치면 저장하고 다음 칸으로 */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "clsSel") { ui.cls = t.value; ui.sel = null; render(); return; }
  if (t.id === "restore") { restore(t.files[0]); return; }
  if (t.classList.contains("roleAdd") && t.value) { const s = t.value; stampRoles(t.dataset.g, R => { (R.x ||= {})[s] = 1; }); return; }
  if (!t.classList.contains("vin")) return;
  const gk = t.dataset.g, s = t.dataset.s, res = curCard(gk), x = res[s] || {};
  const raw = t.value.trim();
  if (raw === "") delete x.v; else { const n = Math.round(+raw); if (!Number.isFinite(n) || n < 0) { toast("0 이상의 숫자를 적어 주세요"); return; } x.v = n; }
  delete x.m;   // 점수를 고치면 자동 순위로 돌아간다
  res[s] = x;
  const inputs = [...document.querySelectorAll(".vin:not(:disabled)")], idx = inputs.indexOf(t);
  const nextKey = inputs[idx + 1] ? inputs[idx + 1].dataset.g + "|" + inputs[idx + 1].dataset.s : null;
  renderLater = false;
  writeCard(gk, res);
  if (nextKey && e.isTrusted && t.dataset.enter) {
    const [g2, s2] = nextKey.split("|"); const n2 = document.querySelector(`.vin[data-g="${g2}"][data-s="${s2}"]`); if (n2) n2.focus();
  }
});
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.k; if (k) ui.open[k] = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("vin")) { e.target.dataset.enter = "1"; e.target.blur(); }
  if (e.key === "Escape") $("big").classList.remove("show");
});
// blur 로 change 가 일어난 뒤 다음 칸으로 — Enter 로 끝냈을 때만
document.addEventListener("focusout", e => {
  const t = e.target;
  if (!(t.classList && t.classList.contains("vin") && t.dataset.enter)) return;
  const g = t.dataset.g, s = t.dataset.s;
  setTimeout(() => {
    const inputs = [...document.querySelectorAll(".vin:not(:disabled)")];
    const i = inputs.findIndex(x => x.dataset.g === g && x.dataset.s === s);
    if (inputs[i + 1]) inputs[i + 1].focus();
  }, 30);
});
$("clsSel").addEventListener("change", e => { ui.cls = e.target.value; ui.focus = null; if (ui.tab === "entry") ui.round = openRound(ui.cls, ui.stage); render(); });

function doImport() {
  const text = $("paste").value; if (!text.trim()) { toast("명렬표를 붙여넣어 주세요"); return; }
  const bulk = text.includes("\t") ? parseBulk(text) : null;
  if (bulk) {
    const names = Object.keys(bulk).sort(numSort);
    const exist = names.filter(c => S.rosters[c]);
    if (!confirm(`${names.length}개 반 (${names.join(", ")}) 을 등록합니다.${exist.length ? `\n이미 있는 ${exist.join(", ")}반은 새 명렬로 바뀝니다(시드 표시는 유지).` : ""}`)) return;
    names.forEach(c => {
      const old = {}; (S.rosters[c] || []).forEach(st => old[st.no] = st.seed);
      put("rosters/" + c, bulk[c].map(st => ({ ...st, seed: !!old[st.no] })), true);
    });
    ui.cls = names[0]; render(); toast(`${names.length}개 반 등록 완료`);
    return;
  }
  const cls = ($("newCls").value || "").trim().replace(/반$/, "");
  if (!cls) { toast("반 이름을 적어 주세요 (예: 1-3)"); return; }
  if (/[.#$\[\]\/]/.test(cls)) { toast("반 이름에 . # $ [ ] / 는 쓸 수 없습니다"); return; }
  const list = parseSimple(text);
  if (!list.length) { toast("학생을 읽지 못했습니다"); return; }
  if (S.rosters[cls] && !confirm(`${cls}반 명렬을 새 명단(${list.length}명)으로 바꿀까요?`)) return;
  ui.cls = cls; put("rosters/" + cls, list); toast(`${cls}반 ${list.length}명 등록`);
}
/* 엑셀 — 첫 시트 '최종점수'(모든 반, 성적 입력용) + 반마다 시트 하나(라운드별 경기 결과 → Ⓐ·Ⓑ·Ⓒ → 최종 점수) */
let xlsxLib = null;
async function loadXLSX() {
  if (xlsxLib) return xlsxLib;
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  return (xlsxLib = window.XLSX);
}
function studentRow(cls, st) {
  const s = sidOf(st), a = record(cls, "cu", s), b = record(cls, "x3", s);
  const rc = roleCounts(cls), on = {}; TASKS.forEach(([k]) => on[k] = taskOn(cls, s, k, rc));
  const t = on, c = taskPts(cls, s, rc), tot = a.area + b.area + c;
  const cnt = rc[s] || {}, roleText = TASKS.filter(([k]) => cnt[k]).map(([k, l]) => l + " " + cnt[k] + "회").join(" · ");
  const miss = [];
  if (a.played < CFG.rounds) miss.push(`카운트업 ${CFG.rounds - a.played}R 미응시`);
  if (b.played < CFG.rounds) miss.push(`301 ${CFG.rounds - b.played}R 미응시`);
  return { s, a, b, t, c, tot, roleText, grade: convTotal(tot), note: miss.join(" / ") };
}
async function downloadXLSX() {
  let X;
  try { X = await loadXLSX(); } catch (e) { toast("엑셀 도구를 불러오지 못했습니다 — 인터넷 연결을 확인하세요"); return; }
  const wb = X.utils.book_new(), date = today();
  const R = CFG.rounds, dash = v => v === undefined || v === null || v === "" ? "" : v;

  // ① 최종점수 — 모든 반
  const sum = [["반", "번호", "이름", "Ⓐ 카운트 업", "Ⓑ 301 게임", "Ⓒ 과제수행", "Ⓐ+Ⓑ+Ⓒ", "최종 점수", "비고"]];
  classNames().forEach(cls => roster(cls).forEach(st => {
    const r = studentRow(cls, st);
    sum.push([cls, +st.no || st.no, st.name, r.a.played ? r.a.area : 0, r.b.played ? r.b.area : 0, r.c, r.tot, r.grade, r.note]);
  }));
  const ws0 = X.utils.aoa_to_sheet(sum);
  ws0["!cols"] = [6, 6, 10, 12, 12, 12, 10, 10, 28].map(w => ({ wch: w }));
  X.utils.book_append_sheet(wb, ws0, "최종점수");

  // ② 반마다 시트
  classNames().forEach(cls => {
    const top = ["번호", "이름"], sub = ["", ""], merges = [{ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }, { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } }];
    const group = (title, cols) => { const c0 = top.length; top.push(title, ...Array(cols.length - 1).fill("")); sub.push(...cols); merges.push({ s: { r: 0, c: c0 }, e: { r: 0, c: c0 + cols.length - 1 } }); };
    for (let i = 1; i <= R; i++) group(`Ⓐ 카운트 업 ${i}R`, ["점수", "순위", "인원", "승점"]);
    group("Ⓐ 결과", ["합산 승점", "Ⓐ 점수"]);
    for (let i = 1; i <= R; i++) group(`Ⓑ 301 ${i}R`, ["순위", "남은점수", "인원", "승점"]);
    group("Ⓑ 결과", ["합산 승점", "Ⓑ 점수"]);
    group("Ⓒ 과제수행", [...TASKS.map(t => t[1]), "Ⓒ 점수", "역할 기록"]);
    group("최종", ["Ⓐ+Ⓑ+Ⓒ", "최종 점수", "비고"]);
    const rows = [top, sub];
    roster(cls).forEach(st => {
      const r = studentRow(cls, st), row = [+st.no || st.no, st.name];
      r.a.rounds.forEach(x => row.push(x ? dash(x.v) : "", x ? x.rank : "", x ? x.n : "", x ? x.pts : ""));
      row.push(r.a.sum, r.a.played ? r.a.area : 0);
      r.b.rounds.forEach(x => row.push(x ? x.rank : "", x ? dash(x.v) : "", x ? x.n : "", x ? x.pts : ""));
      row.push(r.b.sum, r.b.played ? r.b.area : 0);
      row.push(...TASKS.map(([k]) => r.t[k] ? 1 : 0), r.c, r.roleText, r.tot, r.grade, r.note);
      rows.push(row);
    });
    const ws = X.utils.aoa_to_sheet(rows);
    ws["!merges"] = merges;
    ws["!cols"] = top.map((_, i) => ({ wch: i === 1 ? 10 : i === top.length - 1 ? 26 : 8 }));
    X.utils.book_append_sheet(wb, ws, String(cls).replace(/[\[\]:*?\/\\]/g, "-").slice(0, 28) + "반");
  });
  X.writeFile(wb, `스포츠다트_수행평가_${date}.xlsx`);
  toast("엑셀을 내려받았습니다");
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function copy(text) { navigator.clipboard.writeText(text).then(() => toast("복사했습니다"), () => prompt("복사하세요", text)); }
function restore(file) {
  if (!file) return;
  file.text().then(t => {
    const v = JSON.parse(t);
    if (!v || !v.rosters) throw 0;
    if (!confirm("백업으로 전체 자료를 바꿀까요? 지금 자료는 사라집니다.")) return;
    put("rosters", v.rosters, true); put("settings", v.settings || null, true); put("classes", v.classes || {}); toast("백업을 불러왔습니다");
  }).catch(() => toast("백업 파일을 읽지 못했습니다"));
}

render();
updStatus();
if (!params.has("local")) initFB();   // ?local=1 — 서버에 올리지 않고 이 기기에서만 시험
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
